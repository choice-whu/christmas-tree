<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080d16">
  <meta name="description" content="开源 3D 圣诞树照片墙：支持手势交互、网页自定义照片与音乐，以及本地目录同步。">
  <title>树上的圣诞相册</title>
  <link rel="icon" type="image/png" href="./assets/star.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="modulepreload" href="./src/main.js">
  <link rel="modulepreload" href="./src/scene.js">
  <link rel="modulepreload" href="./src/vendor/three.module.js">
  <link rel="modulepreload" href="./src/photos.js">
  <link rel="modulepreload" href="./src/storage.js">
  <link rel="modulepreload" href="./src/gestures.js">
  <link rel="modulepreload" href="./src/camera.js">
  <link rel="stylesheet" href="./assets/site.css">
  <script type="module" src="./src/main.js"></script>
  <noscript><style>
    body { overflow: auto; }
    #prints[hidden] { display: grid !important; padding: 24px; }
  </style></noscript>
</head>
<body>
  <main>
    <h1 class="sr-only">树上的圣诞相册</h1>
    <figure id="stage" class="stage" aria-label="互动圣诞树">
      <img class="stage-poster" src="./assets/tree-poster.webp" alt="夜空里的暖金色圣诞树，树枝间挂着照片" width="900" height="900" fetchpriority="high">
      <div id="canvas-mount"></div>
      <div class="reticle" id="reticle" hidden aria-hidden="true"><i class="reticle-ring"></i></div>
      <p class="stage-toast" id="stage-toast" hidden aria-hidden="true"></p>
      <aside class="camera-hud" id="camera-hud" hidden aria-label="手势识别预览">
        <div class="camera-preview">
          <video id="camera-feed" aria-hidden="true" muted playsinline></video>
          <canvas id="camera-overlay" width="152" height="114" aria-hidden="true"></canvas>
        </div>
        <div class="camera-bar">
          <span class="camera-dot" id="camera-dot" aria-hidden="true"></span>
          <span class="camera-badge" id="camera-badge">未检测到手</span>
          <button class="camera-toggle" id="camera-toggle" type="button" aria-label="收起预览窗" aria-expanded="true"><i class="icon icon-chevron" aria-hidden="true"><b></b></i></button>
        </div>
      </aside>

      <div class="controls controls-top" role="group" aria-label="圣诞树控制">
        <button class="control" id="gesture-button" type="button" aria-label="开启手势" aria-pressed="false" hidden><i class="icon icon-camera" aria-hidden="true"><b></b></i></button>
        <button class="control" id="shape-button" type="button" data-shape="tree" aria-label="切换到星云" aria-pressed="false" hidden><i class="icon icon-tree" aria-hidden="true"><b></b></i><i class="icon icon-nebula" aria-hidden="true"><b></b></i><i class="icon icon-heart" aria-hidden="true"><b></b></i><i class="icon icon-ring" aria-hidden="true"><b></b></i><i class="icon icon-spiral" aria-hidden="true"><b></b></i></button>
      </div>
      <nav class="controls controls-bottom" aria-label="自定义与音乐">
        <button class="control" id="studio-button" type="button" aria-label="自定义照片与音乐" aria-haspopup="dialog" hidden><i class="icon icon-studio" aria-hidden="true"><b></b></i></button>
        <button class="control" id="music-button" type="button" aria-label="播放音乐" aria-pressed="false" hidden><i class="icon icon-music" aria-hidden="true"><b></b></i></button>
      </nav>
      <p class="sr-only" id="stage-status" role="status"></p>
      <p class="sr-only" id="gesture-message" role="status"></p>
      <p class="sr-only" id="upload-note">照片与音乐修改自动保存在当前浏览器。</p>
      <p class="sr-only" id="upload-status" role="status"></p>
    </figure>

    <div class="prints" id="prints" hidden>
      <!-- PHOTOS:START -->
      <a class="print" data-photo-id="1" href="./photos/01-snowy-cabin.jpg" aria-label="查看第 1 张照片"><img src="./assets/thumbs/01-snowy-cabin.webp" alt="相册照片 1" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="2" href="./photos/02-candle-pine.jpg" aria-label="查看第 2 张照片"><img src="./assets/thumbs/02-candle-pine.webp" alt="相册照片 2" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="3" href="./photos/03-hot-cocoa.jpg" aria-label="查看第 3 张照片"><img src="./assets/thumbs/03-hot-cocoa.webp" alt="相册照片 3" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="4" href="./photos/04-fireplace-glow.jpg" aria-label="查看第 4 张照片"><img src="./assets/thumbs/04-fireplace-glow.webp" alt="相册照片 4" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="5" href="./photos/05-golden-bokeh.jpg" aria-label="查看第 5 张照片"><img src="./assets/thumbs/05-golden-bokeh.webp" alt="相册照片 5" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="6" href="./photos/06-pine-lights.jpg" aria-label="查看第 6 张照片"><img src="./assets/thumbs/06-pine-lights.webp" alt="相册照片 6" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="7" href="./photos/07-red-ornament.jpg" aria-label="查看第 7 张照片"><img src="./assets/thumbs/07-red-ornament.webp" alt="相册照片 7" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="8" href="./photos/08-cottage-wreath.jpg" aria-label="查看第 8 张照片"><img src="./assets/thumbs/08-cottage-wreath.webp" alt="相册照片 8" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="9" href="./photos/09-gingerbread-treats.jpg" aria-label="查看第 9 张照片"><img src="./assets/thumbs/09-gingerbread-treats.webp" alt="相册照片 9" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="10" href="./photos/10-winter-pinecone.jpg" aria-label="查看第 10 张照片"><img src="./assets/thumbs/10-winter-pinecone.webp" alt="相册照片 10" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="11" href="./photos/11-spruce-sparkle.jpg" aria-label="查看第 11 张照片"><img src="./assets/thumbs/11-spruce-sparkle.webp" alt="相册照片 11" loading="lazy" decoding="async" width="384" height="480"></a>
      <a class="print" data-photo-id="12" href="./photos/12-hearth-wood.jpg" aria-label="查看第 12 张照片"><img src="./assets/thumbs/12-hearth-wood.webp" alt="相册照片 12" loading="lazy" decoding="async" width="384" height="480"></a>
      <!-- PHOTOS:END -->
    </div>

    <dialog class="studio" id="studio" aria-labelledby="studio-title">
      <div class="studio-head">
        <div class="studio-heading">
          <h2 id="studio-title">自定义圣诞树</h2>
          <span class="studio-count" id="studio-count"></span>
        </div>
        <button class="control" id="studio-close" type="button" aria-label="关闭自定义面板" autofocus><i class="icon icon-close" aria-hidden="true"><b></b></i></button>
      </div>

      <section class="studio-section" aria-label="照片管理">
        <div class="studio-actions">
          <button class="studio-btn studio-btn-primary" id="studio-replace" type="button">替换照片</button>
          <button class="studio-btn" id="studio-add" type="button">追加照片</button>
          <button class="studio-btn" id="studio-clear" type="button">清空照片</button>
          <button class="studio-btn" id="studio-reset" type="button">恢复默认</button>
        </div>
        <input id="upload-replace-input" type="file" accept="image/*" multiple hidden>
        <input id="upload-add-input" type="file" accept="image/*" multiple hidden>
        <div class="studio-grid" id="studio-grid" aria-label="当前照片列表"></div>
      </section>

      <section class="studio-section studio-music" aria-label="背景音乐设置">
        <div class="studio-music-info">
          <span class="studio-label">背景音乐</span>
          <span class="studio-music-name" id="studio-music-name">默认音乐 (music.mp3)</span>
        </div>
        <div class="studio-music-actions">
          <button class="studio-btn" id="studio-music-change" type="button">更换音乐</button>
          <button class="studio-btn" id="studio-music-reset" type="button" hidden>恢复默认音乐</button>
        </div>
        <input id="music-upload-input" type="file" accept="audio/*" hidden>
      </section>

      <p class="studio-status" id="studio-status" role="status"></p>
      <p class="studio-hint">网页中的修改自动保存在当前浏览器；若要发布到自己的 GitHub Pages，可将照片放入 <code>photos/</code> 并运行 <code>node scripts/sync-photos.mjs</code>。</p>
    </dialog>
  </main>

  <dialog class="photo-viewer" id="photo-viewer" aria-label="照片">
    <div class="viewer-picture">
      <img id="viewer-image" alt="">
      <p class="sr-only" id="viewer-error" role="status"></p>
    </div>
    <button class="control viewer-close" type="button" id="viewer-close" aria-label="关闭照片" autofocus><i class="icon icon-close" aria-hidden="true"><b></b></i></button>
    <button class="control viewer-previous" type="button" id="viewer-previous" aria-label="上一张"><i class="icon icon-previous" aria-hidden="true"><b></b></i></button>
    <button class="control viewer-next" type="button" id="viewer-next" aria-label="下一张"><i class="icon icon-next" aria-hidden="true"><b></b></i></button>
    <p class="sr-only" id="viewer-position" aria-live="polite"></p>
  </dialog>
  <audio id="music" loop preload="none" src="./music.mp3"></audio>
</body>
</html>
